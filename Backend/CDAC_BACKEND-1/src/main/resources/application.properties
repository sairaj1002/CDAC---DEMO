spring.application.name=enterprise-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/work_management_system
spring.datasource.username=postgres
spring.datasource.password=sunbeam

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}